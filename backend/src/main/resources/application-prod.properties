# Mounted by the deployment secret provider; missing directory is a startup error.
spring.config.import=configtree:${SECRETS_DIRECTORY:/run/secrets/}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.ssl.enabled=true
server.ssl.key-store=${TLS_KEY_STORE}
server.ssl.key-store-password=${TLS_KEY_STORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3
server.forward-headers-strategy=none
server.tomcat.connection-timeout=5s
server.tomcat.max-http-form-post-size=1MB
server.max-http-request-header-size=16KB
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.data-source-properties.sslmode=verify-full
spring.datasource.hikari.data-source-properties.sslrootcert=${DB_SSL_ROOT_CERT}
spring.datasource.hikari.data-source-properties.options=-c statement_timeout=120000 -c lock_timeout=5000
spring.data.redis.ssl.enabled=true
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-512
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG}
spring.kafka.properties.ssl.endpoint.identification.algorithm=https
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,info
