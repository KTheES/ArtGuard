spring.application.name=artworkguard
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/artworkguard}
spring.datasource.username=${DB_USER:artworkguard}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=2s
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.acks=all
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.request.timeout.ms=10000
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
server.error.include-message=never
server.error.include-stacktrace=never
artworkguard.auth.jwt-secret=${JWT_SECRET}
artworkguard.auth.issuer=artworkguard
artworkguard.auth.audience=artworkguard-api
artworkguard.auth.access-ttl=15m
artworkguard.auth.refresh-ttl=14d
artworkguard.storage.enabled=${S3_ENABLED:false}
artworkguard.storage.region=${AWS_REGION:us-east-1}
artworkguard.storage.endpoint=${S3_ENDPOINT:}
artworkguard.storage.bucket=${S3_BUCKET:}
artworkguard.storage.initialize-local=${S3_INIT_BUCKET:false}
artworkguard.embedding.enabled=${EMBEDDING_ENABLED:false}
artworkguard.embedding.ai-url=${AI_SERVICE_URL:http://127.0.0.1:8001}
artworkguard.embedding.api-key=${AI_API_KEY:}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.max.block.ms=5000

artworkguard.marketplace.mock-enabled=${MOCK_MARKETPLACE_ENABLED:false}

artworkguard.detection.medium=${DETECTION_MEDIUM_THRESHOLD:0.75}
artworkguard.detection.high=${DETECTION_HIGH_THRESHOLD:0.85}
artworkguard.detection.critical=${DETECTION_CRITICAL_THRESHOLD:0.92}

artworkguard.detection.enabled=${DETECTION_ENABLED:false}

artworkguard.aliexpress.enabled=${ALIEXPRESS_ENABLED:false}
artworkguard.aliexpress.app-key=${ALIEXPRESS_APP_KEY:}
artworkguard.aliexpress.app-secret=${ALIEXPRESS_APP_SECRET:}
artworkguard.aliexpress.tracking-id=${ALIEXPRESS_TRACKING_ID:}

artworkguard.notification.enabled=${NOTIFICATION_ENABLED:false}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
spring.servlet.multipart.file-size-threshold=0
artworkguard.email-verification.enabled=${EMAIL_VERIFICATION_ENABLED:false}
artworkguard.notification.from=${NOTIFICATION_FROM:}
artworkguard.notification.app-url=${APP_URL:http://127.0.0.1:3000}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

artworkguard.monitor.enabled=${MONITORING_SCHEDULER_ENABLED:false}
artworkguard.monitor.interval=${MONITORING_SCAN_INTERVAL:PT1H}
artworkguard.monitor.batch-size=${MONITORING_BATCH_SIZE:100}
artworkguard.monitor.result-limit=${MONITORING_RESULT_LIMIT:100}

artworkguard.billing.enabled=${BILLING_ENABLED:false}
artworkguard.billing.stripe-secret-key=${STRIPE_SECRET_KEY:}
artworkguard.billing.stripe-webhook-secret=${STRIPE_WEBHOOK_SECRET:}
artworkguard.billing.creator-price-id=${STRIPE_CREATOR_PRICE_ID:}
artworkguard.billing.pro-price-id=${STRIPE_PRO_PRICE_ID:}
artworkguard.billing.business-price-id=${STRIPE_BUSINESS_PRICE_ID:}
artworkguard.billing.success-url=${BILLING_SUCCESS_URL:http://127.0.0.1:3000/billing/success}
artworkguard.billing.cancel-url=${BILLING_CANCEL_URL:http://127.0.0.1:3000/billing/cancel}
