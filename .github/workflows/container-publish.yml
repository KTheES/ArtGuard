name: Publish Frontend Container

on:
  push:
    branches:
      - main
    tags:
      - "frontend-v*"
    paths:
      - "frontend/**"
      - ".github/workflows/container-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: frontend-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and push GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kthes/artguard/artworkguard-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=match,pattern=frontend-v(.*),group=1
          labels: |
            org.opencontainers.image.source=https://github.com/KTheES/ArtGuard
            org.opencontainers.image.description=ArtworkGuard frontend and local proxy server

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
