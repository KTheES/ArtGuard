name: Publish Frontend Container

on:
  push:
    branches:
      - main
    tags:
      - "frontend-v*"
    paths:
      - "frontend/**"
      - ".github/workflows/container-publish.yml"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/container-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: frontend-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and push GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local verification image
        run: docker build --tag artguard-frontend:ci --file frontend/Dockerfile frontend

      - name: Run container smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name artguard-frontend-ci --publish 127.0.0.1:5173:5173 artguard-frontend:ci
          for attempt in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' artguard-frontend-ci)"
            if [ "$status" = "healthy" ]; then
              curl --fail --silent --show-error http://127.0.0.1:5173/ | grep --quiet "ArtworkGuard"
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs artguard-frontend-ci
              exit 1
            fi
            sleep 2
          done
          docker logs artguard-frontend-ci
          exit 1

      - name: Clean up verification container
        if: always()
        run: docker rm --force artguard-frontend-ci || true

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PACKAGES_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kthes/artguard-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=match,pattern=frontend-v(.*),group=1
          labels: |
            org.opencontainers.image.source=https://github.com/KTheES/ArtGuard
            org.opencontainers.image.description=ArtworkGuard frontend and local proxy server

      - name: Build and push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
