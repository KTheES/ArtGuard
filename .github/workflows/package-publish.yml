name: Publish npm Package

on:
  push:
    tags:
      - "frontend-v*"
  workflow_dispatch:
    inputs:
      package_name:
        description: Package name to publish (use a unique name for namespace diagnostics)
        required: false
        default: "@kthees/artguard-frontend"
      package_version:
        description: Package version to publish
        required: false
        default: "1.0.2"
      token_source:
        description: Token used to authenticate to GitHub Packages
        required: true
        type: choice
        options:
          - github_token
          - packages_token
        default: github_token

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish @kthees/artguard-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: https://npm.pkg.github.com
          scope: "@kthees"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify classic package token identity and scopes
        if: github.event_name == 'workflow_dispatch' && inputs.token_source == 'packages_token'
        shell: bash
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          EXPECTED_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          headers="$RUNNER_TEMP/package-token-headers.txt"
          response="$RUNNER_TEMP/package-token-user.json"
          curl --fail-with-body --silent --show-error \
            --dump-header "$headers" \
            --output "$response" \
            --header "Authorization: Bearer $PACKAGE_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user

          token_login="$(node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const user = JSON.parse(readFileSync(process.argv[1], "utf8"));
            process.stdout.write(user.login ?? "");
          ' "$response")"
          token_scopes="$(sed -n 's/^x-oauth-scopes:[[:space:]]*//Ip' "$headers" | tr -d '\r')"

          echo "Authenticated GitHub user: $token_login"
          echo "OAuth scopes reported by GitHub: ${token_scopes:-<none>}"

          if [ "${token_login,,}" != "${EXPECTED_OWNER,,}" ]; then
            echo "::error::PACKAGES_TOKEN belongs to $token_login, expected $EXPECTED_OWNER."
            exit 1
          fi
          if [[ ",${token_scopes// /}," != *",write:packages,"* ]]; then
            echo "::error::PACKAGES_TOKEN does not report the write:packages scope."
            exit 1
          fi

          npm_identity="$(npm whoami --registry=https://npm.pkg.github.com)"
          echo "GitHub Packages npm identity: $npm_identity"

      - name: Verify built-in GitHub Actions token
        if: github.event_name != 'workflow_dispatch' || inputs.token_source == 'github_token'
        shell: bash
        env:
          ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          headers="$RUNNER_TEMP/github-token-headers.txt"
          curl --fail-with-body --silent --show-error \
            --dump-header "$headers" \
            --output /dev/null \
            --header "Authorization: Bearer $ACTIONS_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY"
          echo "Built-in GITHUB_TOKEN repository API access confirmed."
          sed -n 's/^x-accepted-github-permissions:[[:space:]]*/Accepted API permissions: /Ip' "$headers" | tr -d '\r'
          if npm_identity="$(npm whoami --registry=https://npm.pkg.github.com 2>&1)"; then
            echo "GitHub Packages npm identity: $npm_identity"
          else
            echo "::notice::npm whoami is unavailable for the installation token: $npm_identity"
          fi

      - name: Select package identity
        env:
          PUBLISH_PACKAGE_NAME: ${{ inputs.package_name || '@kthees/artguard-frontend' }}
          PUBLISH_PACKAGE_VERSION: ${{ inputs.package_version || '' }}
        run: |
          npm pkg set "name=$PUBLISH_PACKAGE_NAME"
          if [ -n "$PUBLISH_PACKAGE_VERSION" ]; then
            npm pkg set "version=$PUBLISH_PACKAGE_VERSION"
          fi
          echo "Publishing $(npm pkg get name) at version $(npm pkg get version)"

      - name: Validate package
        run: npm run lint && npm test && npm run build && npm pack --dry-run

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import pkg from "./package.json" with {type: "json"};
            const expected = `frontend-v${pkg.version}`;
            if (process.env.RELEASE_TAG !== expected) {
              throw new Error(`Expected tag ${expected}, received ${process.env.RELEASE_TAG}`);
            }
          '

      - name: Publish package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ (github.event_name != 'workflow_dispatch' || inputs.token_source == 'github_token') && secrets.GITHUB_TOKEN || secrets.PACKAGES_TOKEN }}
