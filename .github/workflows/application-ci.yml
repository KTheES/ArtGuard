name: Application CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: application-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      frontend_ci: ${{ steps.filter.outputs.frontend_ci }}
      deployable: ${{ steps.filter.outputs.deployable }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Classify changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend_ci:
              - "frontend/**"
              - ".github/actions/setup-node-project/**"
              - ".github/workflows/application-ci.yml"
              - ".github/workflows/reusable-node-quality.yml"
            deployable:
              - "frontend/index.html"
              - "frontend/style.css"
              - "frontend/app.js"
              - "frontend/api.js"
              - "frontend/server.mjs"
              - "frontend/scripts/build.mjs"
              - "frontend/package.json"
              - "frontend/package-lock.json"
              - "infra/**"
              - "docker-compose*.yml"

  build:
    name: Build and lint
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up cached Node project
        uses: ./.github/actions/setup-node-project
        with:
          node-version: "22.x"
          working-directory: frontend
          enable-cache: "true"

      - name: Lint JavaScript
        run: npm run lint

      - name: Build web assets
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.run_id }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 14

  test:
    name: Matrix quality
    needs:
      - changes
      - build
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend_ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node-version:
          - "22.x"
          - "24.x"
    uses: ./.github/workflows/reusable-node-quality.yml
    with:
      os: ${{ matrix.os }}
      node-version: ${{ matrix.node-version }}
      artifact-name: frontend-build-${{ github.run_id }}
      enable-cache: true

  deploy:
    name: Deploy CI preview
    needs:
      - changes
      - build
      - test
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.deployable == 'true') &&
      needs.build.result == 'success' &&
      needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ci-preview
    steps:
      - name: Download tested build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ github.run_id }}
          path: deploy/frontend

      - name: Upload deployable artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-deployable-${{ github.run_id }}
          path: deploy/frontend
          if-no-files-found: error
          retention-days: 30

      - name: Verify secret-backed GitHub API access
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {data: repository} = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            core.notice(`Authenticated deploy context for ${repository.full_name}`);

      - name: Notify optional deployment webhook
        env:
          # Scope the optional custom secret to this step only.
          DEPLOY_WEBHOOK_URL: ${{ secrets.ARTGUARD_DEPLOY_WEBHOOK_URL }}
          DEPLOY_PAYLOAD: >-
            {"repository":"${{ github.repository }}","sha":"${{ github.sha }}","run_id":"${{ github.run_id }}"}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "Deployment webhook is not configured; notification skipped."
            exit 0
          fi
          node --input-type=module -e '
            const response = await fetch(process.env.DEPLOY_WEBHOOK_URL, {
              method: "POST",
              headers: {"content-type": "application/json"},
              body: process.env.DEPLOY_PAYLOAD,
            });
            if (!response.ok) throw new Error(`Webhook returned HTTP ${response.status}`);
          '
