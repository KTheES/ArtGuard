name: Application CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-safety:
    name: Repository safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject tracked sensitive files
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(^|/)(\.env($|\.)|.*\.(pem|key|p12|pfx|jks|keystore|db|sqlite|sqlite3)$|credentials\.json$|service-account[^/]*\.json$|\.aws/credentials$|\.npmrc$)'
          tracked="$(git ls-files | grep -E "$forbidden" | grep -Ev '(^|/)\.env\.example$' || true)"
          if [[ -n "$tracked" ]]; then
            printf 'Tracked sensitive file names detected:\n%s\n' "$tracked"
            exit 1
          fi

      - name: Reject strong secret patterns
        shell: bash
        run: |
          set -euo pipefail
          pattern='-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|(gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})|(AKIA|ASIA)[A-Z0-9]{16}|sk-(proj-)?[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{30,}|(sk|rk)_live_[0-9A-Za-z]{16,}'
          if git grep -I -l -E -e "$pattern" -- .; then
            echo 'Strong secret pattern detected in the files listed above.'
            exit 1
          fi

  backend-unit:
    name: Backend unit and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Run unit tests and build executable jar
        run: ./gradlew test bootJar --no-daemon
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-results
          path: backend/build/test-results/test
          if-no-files-found: warn
          retention-days: 14

  backend-integration:
    name: Backend integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Run Testcontainers integration tests
        run: ./gradlew integrationTest --no-daemon
      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-results
          path: backend/build/test-results/integrationTest
          if-no-files-found: warn
          retention-days: 14

  ai-unit:
    name: AI service unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ai-service/requirements.txt
            ai-service/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Prepare test report directory
        run: mkdir -p reports
      - name: Run tests without the downloaded model
        run: python -m pytest -q -m "not model" --junitxml=reports/junit.xml
      - name: Upload AI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-unit-results
          path: ai-service/reports/junit.xml
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Run frontend tests
        run: npm test

  dora-collector:
    name: DORA collector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run collector tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
