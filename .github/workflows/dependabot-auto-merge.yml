name: Dependabot Auto Merge Policy

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: Enable safe Dependabot auto-merge
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for npm patch dev-dependency updates
        if: >-
          steps.metadata.outputs.package-ecosystem == 'npm' &&
          steps.metadata.outputs.update-type == 'version-update:semver-patch' &&
          steps.metadata.outputs.dependency-type == 'direct:development'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Record manual-review decision
        if: >-
          steps.metadata.outputs.package-ecosystem != 'npm' ||
          steps.metadata.outputs.update-type != 'version-update:semver-patch' ||
          steps.metadata.outputs.dependency-type != 'direct:development'
        run: echo "Major, minor, production, Actions, and Docker updates require manual review."
