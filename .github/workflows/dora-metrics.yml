name: DORA Metrics

on:
  schedule:
    # Every Monday at 09:00 KST (00:00 UTC).
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Number of days included in the report
        required: false
        default: "90"
      environment_regex:
        description: Regular expression for production deployment environments
        required: false
        default: "^prod(uction)?$"
      incident_label:
        description: GitHub issue label used for incidents
        required: false
        default: "incident"

permissions:
  contents: write
  deployments: read
  issues: read
  pull-requests: read

concurrency:
  group: dora-metrics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    name: Collect and publish DORA metrics
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run collector tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Collect DORA metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '90' }}
          ENVIRONMENT_REGEX: ${{ inputs.environment_regex || '^prod(uction)?$' }}
          INCIDENT_LABEL: ${{ inputs.incident_label || 'incident' }}
        run: >-
          python scripts/dora_metrics.py
          --repo "${{ github.repository }}"
          --lookback-days "$LOOKBACK_DAYS"
          --environment-regex "$ENVIRONMENT_REGEX"
          --incident-label "$INCIDENT_LABEL"

      - name: Upload JSON and report artifact
        uses: actions/upload-artifact@v4
        with:
          name: dora-metrics-${{ github.run_number }}
          path: |
            reports/dora/latest.json
            reports/dora/WEEKLY_REPORT.md
            docs/dora-dashboard-preview.svg
          if-no-files-found: error
          retention-days: 90

      - name: Publish the latest report to the repository
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/dora/latest.json reports/dora/WEEKLY_REPORT.md docs/dora-dashboard-preview.svg
          if git diff --cached --quiet; then
            echo "No DORA metric changes to publish."
            exit 0
          fi
          git commit -m "docs: update weekly DORA metrics"
          git push
